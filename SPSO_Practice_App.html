<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPSO Practice App</title>
<style>
  :root {
    --blue: #1a3a6b;
    --blue-light: #eef2f9;
    --blue-mid: #3a6bc4;
    --green: #1a6b3a;
    --green-light: #eef9f2;
    --red: #6b1a1a;
    --red-light: #f9eeee;
    --amber: #7a5500;
    --amber-light: #fff8e6;
    --gray: #f5f5f5;
    --border: #dde3ef;
    --text: #1a1a2e;
    --muted: #666;
    --white: #ffffff;
    --radius: 10px;
    --shadow: 0 2px 12px rgba(26,58,107,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f3fa; color: var(--text); min-height: 100vh; }

  /* ── HOME ── */
  #home { max-width: 760px; margin: 0 auto; padding: 2rem 1rem; }
  .app-header { text-align: center; margin-bottom: 2rem; }
  .app-logo { display: inline-flex; align-items: center; gap: 10px; background: var(--blue); color: #fff; padding: 10px 22px; border-radius: 50px; margin-bottom: 1rem; font-size: 15px; font-weight: 600; }
  .app-logo svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
  .app-title { font-size: 28px; font-weight: 700; color: var(--blue); margin-bottom: 6px; }
  .app-sub { font-size: 15px; color: var(--muted); }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 2rem; }
  .stat-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); padding: 1rem; text-align: center; }
  .stat-num { font-size: 26px; font-weight: 700; color: var(--blue); }
  .stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .papers-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .paper-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.25rem; cursor: pointer; transition: all 0.18s; box-shadow: var(--shadow); }
  .paper-card:hover { border-color: var(--blue-mid); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(26,58,107,0.13); }
  .paper-card.done { border-left: 4px solid var(--green); }
  .paper-card.done .paper-badge { background: var(--green-light); color: var(--green); }
  .paper-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .paper-num { font-size: 18px; font-weight: 700; color: var(--blue); }
  .paper-badge { font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; background: var(--blue-light); color: var(--blue); }
  .paper-info { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
  .paper-topics { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .topic-tag { font-size: 11px; padding: 2px 8px; border-radius: 20px; }
  .tag-bio { background: #e8f5e9; color: #2e7d32; }
  .tag-chem { background: #e3f2fd; color: #1565c0; }
  .tag-phys { background: #fff8e1; color: #e65100; }
  .paper-score { font-size: 12px; font-weight: 600; color: var(--green); }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; transition: all 0.15s; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-primary:hover { background: var(--blue-mid); }
  .btn-outline { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
  .btn-outline:hover { background: var(--blue-light); }
  .btn-sm { padding: 6px 14px; font-size: 13px; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-green:hover { opacity: 0.9; }
  .btn-red { background: #c0392b; color: #fff; }
  .btn-red:hover { opacity: 0.9; }

  /* ── EXAM ── */
  #exam { display: none; min-height: 100vh; background: #f0f3fa; }
  .exam-topbar { background: var(--blue); color: #fff; padding: 0 1.5rem; height: 58px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .exam-title-bar { font-size: 15px; font-weight: 600; }
  .timer-box { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 30px; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .timer-box.urgent { background: rgba(220,53,69,0.85); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.7; } }
  .exam-progress { background: rgba(255,255,255,0.15); padding: 6px 14px; border-radius: 30px; font-size: 13px; }
  .exam-body { max-width: 820px; margin: 0 auto; padding: 1.5rem 1rem 6rem; }
  .section-header { background: var(--blue); color: #fff; padding: 10px 18px; border-radius: var(--radius); margin: 1.5rem 0 1rem; font-size: 14px; font-weight: 600; }
  .section-instruction { background: var(--blue-light); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; font-size: 13px; color: var(--blue); margin-bottom: 1.2rem; line-height: 1.6; }
  .question-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); padding: 1.25rem; margin-bottom: 14px; box-shadow: var(--shadow); }
  .question-card.answered { border-left: 4px solid var(--blue-mid); }
  .q-stem { font-size: 15px; font-weight: 500; margin-bottom: 14px; line-height: 1.6; }
  .q-num { color: var(--blue); font-weight: 700; margin-right: 6px; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .option-label { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: 8px; border: 1.5px solid var(--border); cursor: pointer; font-size: 14px; line-height: 1.5; transition: all 0.15s; }
  .option-label:hover { background: var(--blue-light); border-color: var(--blue-mid); }
  .option-label input { display: none; }
  .opt-letter { min-width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: var(--muted); transition: all 0.15s; }
  input[type=radio]:checked + .option-label,
  .option-label.selected { background: var(--blue-light); border-color: var(--blue-mid); }
  input[type=radio]:checked + .option-label .opt-letter,
  .option-label.selected .opt-letter { background: var(--blue); border-color: var(--blue); color: #fff; }
  .stmt-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .stmt-row { display: flex; align-items: flex-start; gap: 10px; background: var(--gray); padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.5; }
  .stmt-num { font-weight: 700; color: var(--blue); min-width: 20px; }

  /* Section B response table */
  .resp-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 10px; }
  .resp-table th { background: var(--blue); color: #fff; padding: 7px 10px; text-align: center; }
  .resp-table td { border: 1px solid var(--border); padding: 7px 10px; text-align: center; }
  .resp-table tr:nth-child(even) td { background: var(--blue-light); }

  /* Bottom nav */
  .exam-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 1px solid var(--border); padding: 12px 1.5rem; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
  .answered-count { font-size: 13px; color: var(--muted); }
  .answered-count span { font-weight: 700; color: var(--blue); }

  /* ── RESULTS ── */
  #results { display: none; max-width: 700px; margin: 0 auto; padding: 2rem 1rem; }
  .results-header { text-align: center; margin-bottom: 2rem; }
  .score-circle { width: 130px; height: 130px; border-radius: 50%; border: 6px solid var(--blue); display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 0 auto 1rem; }
  .score-big { font-size: 34px; font-weight: 800; color: var(--blue); }
  .score-total { font-size: 14px; color: var(--muted); }
  .results-grade { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
  .results-msg { font-size: 15px; color: var(--muted); }
  .breakdown-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 1.5rem 0; }
  .bk-card { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); padding: 1rem; text-align: center; }
  .bk-num { font-size: 22px; font-weight: 700; }
  .bk-label { font-size: 12px; color: var(--muted); }
  .review-list { display: flex; flex-direction: column; gap: 10px; margin-top: 1.5rem; }
  .review-item { background: var(--white); border-radius: var(--radius); border: 1px solid var(--border); padding: 1rem 1.25rem; }
  .review-item.correct { border-left: 4px solid var(--green); }
  .review-item.wrong { border-left: 4px solid #c0392b; }
  .review-item.skipped { border-left: 4px solid #aaa; }
  .review-q { font-size: 14px; font-weight: 500; margin-bottom: 6px; line-height: 1.5; }
  .review-ans { font-size: 13px; margin-top: 4px; }
  .correct-text { color: var(--green); font-weight: 600; }
  .wrong-text { color: #c0392b; font-weight: 600; }
  .skip-text { color: #888; }
  .results-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 2rem; }
  .section-toggle { cursor: pointer; font-size: 15px; font-weight: 600; color: var(--blue); margin: 1rem 0 0.5rem; display: flex; align-items: center; gap: 6px; }

  /* Progress dots */
  .progress-dots { display: flex; flex-wrap: wrap; gap: 5px; margin: 1rem 0; }
  .dot { width: 20px; height: 20px; border-radius: 50%; background: var(--border); font-size: 9px; display: flex; align-items: center; justify-content: center; color: var(--muted); cursor: pointer; }
  .dot.done { background: var(--blue-mid); color: #fff; }

  @media (max-width: 540px) {
    .papers-grid { grid-template-columns: 1fr; }
    .stats-row { grid-template-columns: repeat(3, 1fr); }
    .breakdown-grid { grid-template-columns: repeat(3, 1fr); }
  }
</style>
</head>
<body>

<!-- ══════════════ HOME ══════════════ -->
<div id="home">
  <div class="app-header">
    <div class="app-logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      SPSO Practice
    </div>
    <h1 class="app-title">Singapore Primary Science Olympiad</h1>
    <p class="app-sub">4 full practice papers · 40 questions each · 75 minutes timer</p>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num" id="stat-papers">4</div>
      <div class="stat-label">Papers Available</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-done">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="stat-best">—</div>
      <div class="stat-label">Best Score</div>
    </div>
  </div>

  <div class="papers-grid" id="papers-grid"></div>
</div>

<!-- ══════════════ EXAM ══════════════ -->
<div id="exam">
  <div class="exam-topbar">
    <div class="exam-title-bar" id="exam-title-bar">Paper 1</div>
    <div class="timer-box" id="timer-display">1:15:00</div>
    <div class="exam-progress" id="exam-progress-bar">Q 1 / 40</div>
  </div>
  <div class="exam-body" id="exam-body"></div>
  <div class="exam-nav">
    <div class="answered-count">Answered: <span id="answered-count">0</span> / 40</div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-outline btn-sm" onclick="confirmQuit()">Quit</button>
      <button class="btn btn-primary btn-sm" onclick="submitPaper()">Submit Paper</button>
    </div>
  </div>
</div>

<!-- ══════════════ RESULTS ══════════════ -->
<div id="results">
  <div class="results-header">
    <div class="score-circle" id="score-circle">
      <div class="score-big" id="score-big">0</div>
      <div class="score-total">/ 50</div>
    </div>
    <div class="results-grade" id="results-grade"></div>
    <div class="results-msg" id="results-msg"></div>
  </div>
  <div class="breakdown-grid">
    <div class="bk-card">
      <div class="bk-num" id="bk-correct" style="color:var(--green)">0</div>
      <div class="bk-label">Correct</div>
    </div>
    <div class="bk-card">
      <div class="bk-num" id="bk-wrong" style="color:#c0392b">0</div>
      <div class="bk-label">Wrong</div>
    </div>
    <div class="bk-card">
      <div class="bk-num" id="bk-skip" style="color:#aaa">0</div>
      <div class="bk-label">Skipped</div>
    </div>
  </div>
  <div id="review-sections"></div>
  <div class="results-actions">
    <button class="btn btn-outline" onclick="goHome()">← Back to Papers</button>
    <button class="btn btn-primary" id="next-paper-btn" onclick="nextPaper()">Next Paper →</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════
   QUESTION BANK — 4 Papers × 40 Questions
   Section A: Q1-30 (1 mark each)
   Section B: Q31-40 (2 marks each, A/B/C/D response)
═══════════════════════════════════════════ */

const PAPERS = [

/* ══════════ PAPER 1 ══════════ */
{
  title: "Paper 1",
  topics: ["Plants & Animals","States of Matter","Forces & Energy"],
  sectionA: [
    // Biology Q1-10
    { q:"Which part of a plant carries water and minerals from the roots to the leaves?", opts:["A. Phloem","B. Xylem","C. Epidermis","D. Stomata"], ans:"B" },
    { q:"Which of the following animals undergoes complete metamorphosis?", opts:["A. Grasshopper","B. Cockroach","C. Butterfly","D. Dragonfly nymph"], ans:"C" },
    { q:"A plant is kept in a sealed transparent box in sunlight. After several hours, water droplets appear on the inside of the box. This water came from:", opts:["A. Photosynthesis","B. Transpiration through stomata","C. Condensation of outside air","D. Root absorption only"], ans:"B" },
    { q:"Which of the following is NOT a characteristic of living things?", opts:["A. Respond to stimuli","B. Reproduce","C. Made of metal","D. Require energy"], ans:"C" },
    { q:"In which organ does digestion of starch begin?", opts:["A. Stomach","B. Small intestine","C. Mouth","D. Large intestine"], ans:"C" },
    { q:"A food chain is: Algae → Water flea → Small fish → Large fish. If all small fish were removed, what would most likely happen to the water flea population?", opts:["A. Decrease because large fish eat them","B. Increase because their predator is removed","C. Stay the same","D. Disappear immediately"], ans:"B" },
    { q:"Which of the following is a seed dispersal method that uses wind?", opts:["A. A coconut floating in water","B. A burr hooking onto animal fur","C. A dandelion seed with a feathery parachute","D. A fruit being eaten and its seed excreted"], ans:"C" },
    { q:"Which gas do plants take in during photosynthesis?", opts:["A. Oxygen","B. Nitrogen","C. Carbon dioxide","D. Hydrogen"], ans:"C" },
    { q:"Which of the following best describes a cold-blooded animal?", opts:["A. An animal whose body temperature changes with the environment","B. An animal that lives in cold regions","C. An animal whose body temperature stays constant","D. An animal that eats cold food"], ans:"A" },
    { q:"Which structure in a cell controls what enters and leaves it?", opts:["A. Cell wall","B. Nucleus","C. Cell membrane","D. Cytoplasm"], ans:"C" },
    // Chemistry Q11-20
    { q:"What happens to water molecules when water is heated from 20°C to 80°C?", opts:["A. They move slower and come closer together","B. They gain energy and move faster","C. They break apart into hydrogen and oxygen","D. They change colour"], ans:"B" },
    { q:"Which of the following is NOT a property of metals?", opts:["A. Good conductor of heat","B. Malleable","C. Transparent","D. Shiny when polished"], ans:"C" },
    { q:"Salt water is a mixture. Which method would best obtain pure salt from salt water?", opts:["A. Filtration","B. Using a magnet","C. Evaporation then collection of crystals","D. Distillation and discarding the water"], ans:"C" },
    { q:"A student mixes vinegar and bicarbonate of soda. Bubbles of gas are produced. This is:", opts:["A. Physical change — a new mixture","B. Chemical change — a new substance is formed","C. Physical change — the gas was already in the vinegar","D. Not a change at all"], ans:"B" },
    { q:"Which state of matter has a definite shape and volume?", opts:["A. Gas","B. Liquid","C. Solid","D. Plasma"], ans:"C" },
    { q:"Iron has a melting point of 1538°C and a boiling point of 2861°C. What is its state at 2000°C?", opts:["A. Solid","B. Liquid","C. Gas","D. It cannot exist"], ans:"B" },
    { q:"Which of the following pairs are both mixtures?", opts:["A. Air and salt water","B. Pure gold and pure water","C. Oxygen and iron","D. Water and ice"], ans:"A" },
    { q:"Why does a wet cloth feel cool when placed on your forehead?", opts:["A. Water absorbs heat from the skin as it evaporates","B. Cloth is a good conductor of cold","C. Water has a low temperature","D. Evaporation releases heat"], ans:"A" },
    { q:"Which of the following substances can be separated by chromatography?", opts:["A. Sand and gravel","B. Salt and water","C. Different coloured inks mixed together","D. Iron and copper filings"], ans:"C" },
    { q:"Steel wool left in a damp place turns orange-brown. This is because:", opts:["A. Steel absorbs water and changes colour","B. Iron reacts with oxygen and water to form rust","C. Steel reflects orange light","D. Humidity stains the steel"], ans:"B" },
    // Physics Q21-30
    { q:"A student pushes two boxes — one heavy and one light — with the same force. Which box accelerates more?", opts:["A. The heavy box","B. The light box","C. Both accelerate equally","D. Neither moves"], ans:"B" },
    { q:"Which of the following is NOT a form of energy?", opts:["A. Light","B. Sound","C. Mass","D. Heat"], ans:"C" },
    { q:"A shadow is formed because:", opts:["A. Light is absorbed by all objects","B. Light travels in straight lines and cannot pass through opaque objects","C. The object reflects all light","D. Light slows down near objects"], ans:"B" },
    { q:"Which of the following correctly describes how a mirror forms an image?", opts:["A. It refracts light","B. It absorbs light and re-emits it","C. It reflects light at the same angle it hits the surface","D. It bends light towards the normal"], ans:"C" },
    { q:"A ball rolls along a smooth surface. What will eventually cause it to stop?", opts:["A. Gravity pulling it down","B. Air resistance and friction","C. The ball running out of energy internally","D. The ball converting all energy to light"], ans:"B" },
    { q:"Which of the following is an example of potential energy converting to kinetic energy?", opts:["A. A battery charging a phone","B. A boulder rolling down a hill","C. A plant converting sunlight to glucose","D. An ice cube melting"], ans:"B" },
    { q:"In a simple series circuit with two identical bulbs and one battery, what happens when one bulb is unscrewed?", opts:["A. The other bulb glows twice as bright","B. The other bulb stays the same brightness","C. The other bulb goes out too","D. The battery dies immediately"], ans:"C" },
    { q:"A student stands 4 m from a wall and claps. She hears the echo 0.024 seconds later. What is the approximate speed of sound?", opts:["A. 167 m/s","B. 333 m/s","C. 400 m/s","D. 96 m/s"], ans:"B" },
    { q:"What type of lever is a pair of scissors?", opts:["A. First-class lever — fulcrum between effort and load","B. Second-class lever — load between fulcrum and effort","C. Third-class lever — effort between fulcrum and load","D. Not a lever"], ans:"A" },
    { q:"Which of the following describes the energy transformation in a solar panel?", opts:["A. Chemical → Electrical","B. Light → Electrical","C. Heat → Light","D. Electrical → Light"], ans:"B" },
  ],
  sectionB: [
    { stem:"Which of the following statements about photosynthesis are correct?",
      stmts:["Photosynthesis requires sunlight, carbon dioxide, and water.","Photosynthesis releases carbon dioxide as a by-product.","Glucose produced in photosynthesis can be converted to starch for storage."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","1, 3 only"],["D","2, 3 only"]], ans:"C" },
    { stem:"A student investigates how light affects the rate of oxygen production in a water plant. Which statements correctly describe how to make this a fair test?",
      stmts:["Keep the temperature of the water the same throughout.","Use the same type and amount of water plant in each trial.","Change the type of plant used at each light intensity."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","2, 3 only"],["D","1 only"]], ans:"B" },
    { stem:"Which statements about the particle model of matter are correct?",
      stmts:["All matter is made of tiny particles that are in constant motion.","In a solid, particles are arranged in a regular pattern and vibrate in fixed positions.","When a gas is compressed, the particles themselves get smaller."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","1, 3 only"],["D","2, 3 only"]], ans:"B" },
    { stem:"Which of the following are examples of a chemical change?",
      stmts:["Burning a candle","Dissolving sugar in tea","Baking bread in an oven"],
      opts:[["A","1, 2, 3"],["B","1, 3 only"],["C","2, 3 only"],["D","1 only"]], ans:"B" },
    { stem:"A student compares the brightness of a bulb in a series circuit vs a parallel circuit, using the same battery and identical bulbs. Which statements are correct?",
      stmts:["The bulb in the parallel circuit glows brighter because it receives the full battery voltage.","The bulb in the series circuit glows brighter because current builds up.","Adding more bulbs in parallel does not dim the original bulbs."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","1, 3 only"],["D","2, 3 only"]], ans:"C" },
    { stem:"Which statements correctly describe properties of sound?",
      stmts:["Sound requires a medium (solid, liquid, or gas) to travel through.","Sound travels faster in air than in water.","A higher frequency sound produces a higher pitch."],
      opts:[["A","1, 2, 3"],["B","1, 3 only"],["C","2, 3 only"],["D","1, 2 only"]], ans:"B" },
    { stem:"Which of the following statements about food chains and food webs are correct?",
      stmts:["Energy flows from producers to consumers.","A food web is more stable than a food chain because there are alternative food sources.","Producers are always animals that eat plants."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","2, 3 only"],["D","1, 3 only"]], ans:"B" },
    { stem:"Which statements about forces are correct?",
      stmts:["A force is needed to keep a moving object moving at constant speed on a frictionless surface.","Forces can change the shape, speed, or direction of an object.","When two equal and opposite forces act on an object, the object remains stationary or moves at constant speed."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","2, 3 only"],["D","1, 3 only"]], ans:"C" },
    { stem:"Which statements about adaptation are correct?",
      stmts:["A polar bear's thick white fur helps it stay warm and provides camouflage.","A fish's streamlined body reduces water resistance.","A cactus stores water in its roots because it has no stem."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","2, 3 only"],["D","1, 3 only"]], ans:"B" },
    { stem:"A student claims: 'If the height of a pendulum's swing is increased, its period (time for one complete swing) will increase.' Which statements correctly assess this claim?",
      stmts:["This is a valid scientific hypothesis because it makes a testable prediction.","The period of a pendulum depends on its length, not its swing height — the claim is incorrect.","To test the claim fairly, only the swing height should be changed while keeping the pendulum length constant."],
      opts:[["A","1, 2, 3"],["B","1, 3 only"],["C","2, 3 only"],["D","1, 2 only"]], ans:"A" },
  ]
},

/* ══════════ PAPER 2 ══════════ */
{
  title: "Paper 2",
  topics: ["Human Body","Materials","Light & Heat"],

      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","2, 3 only"],["D","1, 3 only"]], ans:"B" },
    { stem:"Which statements about waves are correct?",
      stmts:["Frequency and wavelength are inversely proportional if wave speed is constant.","Amplitude determines the energy carried by a wave.","All waves require a medium to travel through."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","2, 3 only"],["D","1, 3 only"]], ans:"B" },
    { stem:"A student tests four types of soil to see which holds the most water. Which statements describe a fair test?",
      stmts:["Use the same volume of soil in each test tube.","Pour the same volume of water through each soil sample.","Use different sized funnels for each soil type."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","2, 3 only"],["D","1, 3 only"]], ans:"B" },
    { stem:"Which statements about Newton's laws of motion are correct?",
      stmts:["Newton's First Law says an object at rest will remain at rest unless acted upon by a net force.","Newton's Second Law states that F = ma (force = mass × acceleration).","Newton's Third Law means that if you push a wall, the wall pushes back with a greater force."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","1, 3 only"],["D","2, 3 only"]], ans:"B" },
    { stem:"Which statements about the pH scale are correct?",
      stmts:["A substance with pH 7 is neutral.","A lower pH number indicates a stronger acid.","Universal indicator turns blue in neutral solutions."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","1, 3 only"],["D","2, 3 only"]], ans:"B" },
    { stem:"Which statements about scientific variables are correct?",
      stmts:["The independent variable is the one the experimenter deliberately changes.","The dependent variable is measured as the outcome of the experiment.","Control variables are changed every trial to see their effect."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","2, 3 only"],["D","1, 3 only"]], ans:"B" },
    { stem:"Which statements about sound waves are correct?",
      stmts:["Sound is a longitudinal wave that travels by compression and rarefaction of particles.","Sound travels faster in solids than in gases.","Sound can travel through a vacuum."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","2, 3 only"],["D","1, 3 only"]], ans:"B" },
    { stem:"Which statements about combustion reactions are correct?",
      stmts:["Complete combustion of a hydrocarbon produces carbon dioxide and water.","Incomplete combustion can produce carbon monoxide, which is toxic.","All combustion reactions absorb energy from the surroundings."],
      opts:[["A","1, 2, 3"],["B","1, 2 only"],["C","2, 3 only"],["D","1, 3 only"]], ans:"B" },
  ]
}

]; // end PAPERS

/* ══════════════════════════════════════
   APP STATE
══════════════════════════════════════ */
let currentPaper = null;
let userAnswers = {};
let timerInterval = null;
let timeLeft = 75 * 60;
let scores = JSON.parse(localStorage.getItem('spso_scores') || '{}');

/* ══════════════════════════════════════
   HOME
══════════════════════════════════════ */
function renderHome() {
  const done = Object.keys(scores).length;
  const best = done ? Math.max(...Object.values(scores).map(s => s.score)) + '/50' : '—';
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-best').textContent = best;

  const grid = document.getElementById('papers-grid');
  grid.innerHTML = '';
  PAPERS.forEach((p, i) => {
    const sc = scores[i];
    const isDone = !!sc;
    const card = document.createElement('div');
    card.className = 'paper-card' + (isDone ? ' done' : '');
    card.innerHTML = `
      <div class="paper-top">
        <div class="paper-num">${p.title}</div>
        <div class="paper-badge">${isDone ? '✓ Done' : '40 Qs · 75 min'}</div>
      </div>
      <div class="paper-info">40 questions &bull; Section A (30×1mk) + Section B (10×2mk) &bull; 75 minutes</div>
      <div class="paper-topics">
        ${p.topics.map((t,ti) => `<span class="topic-tag ${ti===0?'tag-bio':ti===1?'tag-chem':'tag-phys'}">${t}</span>`).join('')}
      </div>
      ${isDone ? `<div class="paper-score">Best score: ${sc.score}/50 (${Math.round(sc.score/50*100)}%)</div>` : ''}
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button class="btn btn-primary btn-sm" onclick="startPaper(${i})">
          ${isDone ? 'Retry Paper' : 'Start Paper'}
        </button>
        ${isDone ? `<button class="btn btn-outline btn-sm" onclick="viewResults(${i})">View Results</button>` : ''}
      </div>`;
    grid.appendChild(card);
  });
}

/* ══════════════════════════════════════
   EXAM
══════════════════════════════════════ */
function startPaper(idx) {
  currentPaper = idx;
  userAnswers = {};
  timeLeft = 75 * 60;
  document.getElementById('home').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('exam').style.display = 'block';
  document.getElementById('exam-title-bar').textContent = PAPERS[idx].title;
  renderExam(idx);
  startTimer();
}

function renderExam(idx) {
  const paper = PAPERS[idx];
  const body = document.getElementById('exam-body');
  body.innerHTML = '';

  // Section A
  const secA = document.createElement('div');
  secA.innerHTML = '<div class="section-header">Section A — 30 Questions (1 mark each)</div>' +
    '<div class="section-instruction">For each question, choose the <strong>one best answer</strong> (A, B, C, or D).</div>';
  paper.sectionA.forEach((q, i) => {
    secA.appendChild(makeQuestionCard(i + 1, q, 'A', i));
  });
  body.appendChild(secA);

  // Section B
  const respTable = `<table class="resp-table"><tr><th>Response</th><th>A</th><th>B</th><th>C</th><th>D</th></tr>
    <tr><td>Correct statements</td><td>1, 2, 3</td><td>1, 2 only</td><td>2, 3 only</td><td>1 only</td></tr></table>`;
  const secB = document.createElement('div');
  secB.innerHTML = '<div class="section-header">Section B — 10 Questions (2 marks each)</div>' +
    '<div class="section-instruction">One or more of the three statements may be correct. Choose the response (A–D) that matches the correct statements.<br>' + respTable + '</div>';
  paper.sectionB.forEach((q, i) => {
    secB.appendChild(makeQuestionCardB(31 + i, q, i));
  });
  body.appendChild(secB);

  updateAnsweredCount();
}

function makeQuestionCard(num, q, section, dataIdx) {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.id = `card-${num}`;
  let optsHtml = q.opts.map(o => {
    const letter = o.charAt(0);
    return `<label class="option-label" id="lbl-${num}-${letter}">
      <input type="radio" name="q${num}" value="${letter}" onchange="selectAnswer(${num}, '${letter}', '${section}', ${dataIdx})">
      <span class="opt-letter">${letter}</span>
      <span>${o.slice(3)}</span>
    </label>`;
  }).join('');
  card.innerHTML = `<div class="q-stem"><span class="q-num">${num}.</span>${q.q}</div>
    <div class="options">${optsHtml}</div>`;
  return card;
}

function makeQuestionCardB(num, q, dataIdx) {
  const card = document.createElement('div');
  card.className = 'question-card';
  card.id = `card-${num}`;
  let stmtsHtml = q.stmts.map((s, i) => `<div class="stmt-row"><span class="stmt-num">${i+1}.</span><span>${s}</span></div>`).join('');
  let optsHtml = q.opts.map(o => {
    const letter = o[0];
    return `<label class="option-label" id="lbl-${num}-${letter}">
      <input type="radio" name="q${num}" value="${letter}" onchange="selectAnswer(${num}, '${letter}', 'B', ${dataIdx})">
      <span class="opt-letter">${letter}</span>
      <span><strong>${letter}</strong> — ${o[1]}</span>
    </label>`;
  }).join('');
  card.innerHTML = `<div class="q-stem"><span class="q-num">${num}.</span>${q.stem}</div>
    <div class="stmt-group">${stmtsHtml}</div>
    <div class="options">${optsHtml}</div>`;
  return card;
}

function selectAnswer(num, letter, section, dataIdx) {
  userAnswers[num] = { answer: letter, section, dataIdx };
  const card = document.getElementById(`card-${num}`);
  if (card) card.classList.add('answered');
  updateAnsweredCount();
  updateProgress(num);
}

function updateAnsweredCount() {
  document.getElementById('answered-count').textContent = Object.keys(userAnswers).length;
}

function updateProgress(num) {
  document.getElementById('exam-progress-bar').textContent = `Q ${num} / 40`;
}

function startTimer() {
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    timeLeft--;
    const h = Math.floor(timeLeft / 3600);
    const m = Math.floor((timeLeft % 3600) / 60);
    const s = timeLeft % 60;
    const disp = h > 0
      ? `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`
      : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    const el = document.getElementById('timer-display');
    el.textContent = disp;
    el.className = 'timer-box' + (timeLeft <= 300 ? ' urgent' : '');
    if (timeLeft <= 0) { clearInterval(timerInterval); submitPaper(); }
  }, 1000);
}

function confirmQuit() {
  if (confirm('Are you sure you want to quit? Your answers will be lost.')) {
    clearInterval(timerInterval);
    goHome();
  }
}

/* ══════════════════════════════════════
   SUBMIT & SCORE
══════════════════════════════════════ */
function submitPaper() {
  clearInterval(timerInterval);
  const paper = PAPERS[currentPaper];
  let score = 0, correct = 0, wrong = 0, skip = 0;
  const details = [];

  // Section A
  paper.sectionA.forEach((q, i) => {
    const qNum = i + 1;
    const ua = userAnswers[qNum];
    const userAns = ua ? ua.answer : null;
    const isCorrect = userAns === q.ans;
    if (!userAns) skip++;
    else if (isCorrect) { correct++; score++; }
    else wrong++;
    details.push({ num: qNum, stem: q.q, correct: q.ans, user: userAns, isCorrect, section: 'A', opts: q.opts });
  });

  // Section B
  paper.sectionB.forEach((q, i) => {
    const qNum = 31 + i;
    const ua = userAnswers[qNum];
    const userAns = ua ? ua.answer : null;
    const isCorrect = userAns === q.ans;
    if (!userAns) skip++;
    else if (isCorrect) { correct++; score += 2; }
    else wrong++;
    details.push({ num: qNum, stem: q.stem, correct: q.ans, user: userAns, isCorrect, section: 'B', opts: q.opts });
  });

  // Save best score
  const prev = scores[currentPaper];
  if (!prev || score > prev.score) {
    scores[currentPaper] = { score, details };
    localStorage.setItem('spso_scores', JSON.stringify(scores));
  }

  showResults(score, correct, wrong, skip, details);
}

/* ══════════════════════════════════════
   RESULTS
══════════════════════════════════════ */
function showResults(score, correct, wrong, skip, details) {
  document.getElementById('exam').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  window.scrollTo(0, 0);

  document.getElementById('score-big').textContent = score;
  document.getElementById('bk-correct').textContent = correct;
  document.getElementById('bk-wrong').textContent = wrong;
  document.getElementById('bk-skip').textContent = skip;

  const pct = Math.round(score / 50 * 100);
  let grade, msg, color;
  if (pct >= 88) { grade = '🥇 Gold'; msg = 'Outstanding! IMSO team material!'; color = '#b8860b'; }
  else if (pct >= 76) { grade = '🥈 Silver'; msg = 'Excellent work! Keep it up!'; color = '#708090'; }
  else if (pct >= 64) { grade = '🥉 Bronze'; msg = 'Good job! Review the questions you missed.'; color = '#cd7f32'; }
  else { grade = 'Certificate of Participation'; msg = 'Good effort! Practise more and you will improve!'; color = 'var(--blue)'; }

  document.getElementById('results-grade').textContent = grade;
  document.getElementById('results-grade').style.color = color;
  document.getElementById('results-msg').textContent = msg;
  document.getElementById('score-circle').style.borderColor = color;
  document.getElementById('score-big').style.color = color;

  const nextBtn = document.getElementById('next-paper-btn');
  nextBtn.style.display = currentPaper < PAPERS.length - 1 ? 'inline-flex' : 'none';

  // Review
  const rv = document.getElementById('review-sections');
  rv.innerHTML = '';
  ['A', 'B'].forEach(sec => {
    const secDetails = details.filter(d => d.section === sec);
    const toggle = document.createElement('div');
    toggle.className = 'section-toggle';
    toggle.innerHTML = `▼ Section ${sec} Review (${secDetails.filter(d=>d.isCorrect).length}/${secDetails.length} correct)`;
    const list = document.createElement('div');
    list.className = 'review-list';
    secDetails.forEach(d => {
      const cls = !d.user ? 'skipped' : d.isCorrect ? 'correct' : 'wrong';
      const statusText = !d.user
        ? '<span class="skip-text">Not answered</span>'
        : d.isCorrect
          ? `<span class="correct-text">✓ Correct — ${d.correct}</span>`
          : `<span class="wrong-text">✗ Your answer: ${d.user} &nbsp;|&nbsp; Correct: ${d.correct}</span>`;
      const item = document.createElement('div');
      item.className = `review-item ${cls}`;
      item.innerHTML = `<div class="review-q"><strong>Q${d.num}.</strong> ${d.stem}</div>
        <div class="review-ans">${statusText}</div>`;
      list.appendChild(item);
    });
    let open = false;
    toggle.onclick = () => {
      open = !open;
      list.style.display = open ? 'flex' : 'none';
      toggle.innerHTML = `${open?'▲':'▼'} Section ${sec} Review (${secDetails.filter(d=>d.isCorrect).length}/${secDetails.length} correct)`;
    };
    list.style.display = 'none';
    rv.appendChild(toggle);
    rv.appendChild(list);
  });
}

function viewResults(idx) {
  const sc = scores[idx];
  if (!sc) return;
  currentPaper = idx;
  const paper = PAPERS[idx];
  let correct = 0, wrong = 0, skip = 0;
  sc.details.forEach(d => {
    if (!d.user) skip++;
    else if (d.isCorrect) correct++;
    else wrong++;
  });
  showResults(sc.score, correct, wrong, skip, sc.details);
}

function nextPaper() {
  if (currentPaper < PAPERS.length - 1) startPaper(currentPaper + 1);
}

function goHome() {
  document.getElementById('exam').style.display = 'none';
  document.getElementById('results').style.display = 'none';
  document.getElementById('home').style.display = 'block';
  clearInterval(timerInterval);
  renderHome();
  window.scrollTo(0, 0);
}

/* init */
renderHome();
</script>
</body>
</html>
